<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rehua</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; color: #e8ecf5; font-family: -apple-system, system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #8b96b0; max-width: 320px; line-height: 1.5; margin: 0 0 24px; }
      button { background: #ffc94a; color: #05070d; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 16px; font-weight: 600; }
      .star { font-size: 40px; color: #ffc94a; }
    </style>
  </head>
  <body>
    <main>
      <div class="star">✦</div>
      <h1>You're offline</h1>
      <p>Rehua needs an internet connection to reach the AI models. Check your Wi-Fi or mobile data and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
